name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  build-and-test:
    name: Build & test .NET API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore backend/LocalizadorCafes.sln

      - name: Build
        run: dotnet build backend/LocalizadorCafes.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/LocalizadorCafes.sln --no-build --configuration Release --verbosity normal
