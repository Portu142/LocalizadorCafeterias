<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Localizador de Cafés | Cafeterías de especialidad cerca de ti</title>
    <meta
      name="description"
      content="Encuentra cafeterías cerca de ti en un mapa interactivo: ordénalas por distancia, consulta horarios y dirección, guarda favoritas y deja tu reseña."
    />
    <meta name="author" content="Localizador de Cafés" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#3f2d23" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="apple-mobile-web-app-title" content="Cafés" />

    <link rel="canonical" href="%SITE_URL%" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Localizador de Cafés" />
    <meta property="og:title" content="Localizador de Cafés | Cafeterías de especialidad cerca de ti" />
    <meta
      property="og:description"
      content="Mapa interactivo, orden por cercanía y reseñas de cafeterías de especialidad cerca de ti."
    />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%OG_IMAGE_URL%" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Localizador de Cafés: cafeterías de especialidad cerca de ti"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Localizador de Cafés | Cafeterías cerca de ti" />
    <meta
      name="twitter:description"
      content="Encuentra cafeterías de especialidad cerca de ti con mapa interactivo y reseñas."
    />
    <meta name="twitter:image" content="%OG_IMAGE_URL%" />
    <meta
      name="twitter:image:alt"
      content="Localizador de Cafés: mapa y fichas de cafeterías de especialidad"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="dns-prefetch" href="https://photon.komoot.io" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Localizador de Cafés",
        "url": "%SITE_URL%",
        "description": "Localizador de cafeterías de especialidad cerca de ti con mapa interactivo, orden por cercanía y reseñas.",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "Web",
        "inLanguage": "es",
        "isAccessibleForFree": true
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="noscript-message">
        <strong>Localizador de Cafés</strong> necesita JavaScript para mostrar el
        mapa y las cafeterías. Actívalo en tu navegador para continuar.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
